modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Oculifelis"
credits="Original Gadomancy by makeo and HellFirePvP, maintained for 1.7.10 by the GTNewHorizons team. Thaumaturge by Leclowndu93150 and contributors. Port and new textures by Oculifelis."
description='''
A port of Gadomancy (Thaumcraft 4 addon, GTNH 1.5.17) to Thaumaturge on NeoForge 26.1.2.
Golem materials, seals and accessories; remote and sticky jars; the Arcane Dropper, Arcane Packager, Essentia Compressor, Block Protector and Book of Knowledge; aura cores, aura pylons, the Infusion Claw and the Node Manipulator; the Ethereal Familiar, revealing and disguised armour, and four new potions.
'''

